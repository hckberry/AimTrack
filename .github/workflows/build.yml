name: Build AimTrack APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has gradle-wrapper.properties but no gradlew / wrapper jar,
      # so install Gradle 8.9 (the version the project asks for) directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - name: Build release APK (unsigned)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleRelease --stacktrace --no-daemon

      # An unsigned release APK cannot be installed, so align and sign it.
      # Uses your own keystore if the KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets
      # exist; otherwise generates a throwaway one for this run.
      - name: Align and sign APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Input: $IN  Build-tools: $BT"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            PASS="aimtrack-temp-pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias aimtrack \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=AimTrack"
          fi

          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias aimtrack \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out AimTrack-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose AimTrack-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AimTrack-apk
          path: ${{ steps.proj.outputs.dir }}/AimTrack-release.apk
          if-no-files-found: error
